<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locket Gold Unlocker - Đang Bảo Trì</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0B0C10;
            --surface: #1B1D23;
            --surface-dark: #0F1117;
            --primary: #FFD700;
            --primary-soft: rgba(255, 215, 0, 0.1);
            --accent-red: #F43F5E;
            --accent-green: #10B981;
            --border: rgba(255, 255, 255, 0.06);
            --text: #F8F9FA;
            --text-muted: #8E9196;
            --ease: cubic-bezier(0.2, 0, 0, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(255,255,255,0.02) 1px, rgba(255,255,255,0.02) 2px),
                repeating-linear-gradient(90deg, transparent, transparent 1px, rgba(255,255,255,0.02) 1px, rgba(255,255,255,0.02) 2px);
            pointer-events: none;
            z-index: 1;
        }

        .glow-yellow {
            position: fixed;
            top: -400px;
            left: -400px;
            width: 1200px;
            height: 1200px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(200px);
            pointer-events: none;
            z-index: 0;
        }

        .glow-red {
            position: fixed;
            top: 0;
            right: -600px;
            width: 1400px;
            height: 1400px;
            background: radial-gradient(circle, rgba(190, 24, 93, 0.22) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(200px);
            pointer-events: none;
            z-index: 0;
        }

        main {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 20px;
        }

        .maintenance-card {
            background: rgba(27, 29, 35, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 60px 40px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: var(--primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 800;
            color: #000;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }

        .maintenance-card h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text);
            margin-bottom: 8px;
        }

        .maintenance-card p {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-muted);
        }

        .tag-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            padding: 10px 20px;
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-red);
            text-decoration: none;
            margin-top: 16px;
            transition: all 0.3s ease;
        }

        .tag-badge:hover {
            background: rgba(244, 63, 94, 0.2);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
        }

        footer a {
            color: inherit;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="glow-yellow"></div>
    <div class="glow-red"></div>

    <main>
        <div class="maintenance-card">
            <div class="logo">H</div>
            <div>
                <h1>Hệ Thống Đang Bảo Trì</h1>
                <p>Locket Gold Unlocker hiện đang được nâng cấp hệ thống máy chủ để phục vụ ổn định hơn.<br>Vui lòng quay lại sau nhé! 🛠️</p>
            </div>
            
            <a href="https://www.facebook.com/GiaHuyPH/" target="_blank" class="tag-badge">
                Liên hệ Facebook Admin
            </a>
        </div>
        
        <footer>
            Thiết kế bởi <a href="https://phghuy.dev" target="_blank">PHGHuy</a> &copy; 2026
        </footer>
    </main>
</body>

</html>
